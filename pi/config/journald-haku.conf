# Haku Pi — généré le 27/08/2026
# Installé en /etc/systemd/journald.conf.d/10-haku-volatile.conf
#
# Protection de la carte SD (bateau inoccupé des semaines) : les journaux
# systèmes vivent en RAM uniquement. Ils sont perdus au reboot — assumé et
# compensé par : l'alerte « Pi redémarré », le journal CSV Haku (sur SD,
# quelques octets/jour) et /var/lib/haku/alerts.log (trace des alertes).
#
# Pour repasser en persistant le temps d'un débogage :
#   sudo rm /etc/systemd/journald.conf.d/10-haku-volatile.conf
#   sudo systemctl restart systemd-journald
[Journal]
Storage=volatile
RuntimeMaxUse=32M
RuntimeKeepFree=16M
SystemMaxUse=64M
MaxRetentionSec=1month
