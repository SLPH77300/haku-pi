# Haku Pi — généré le 27/08/2026
# Installé en /etc/systemd/system.conf.d/10-haku-watchdog.conf
#
# Watchdog MATÉRIEL du Raspberry Pi (contrôleur bcm2835_wdt) piloté par
# systemd (PID 1) : si le noyau ou systemd gèle, le SoC redémarre la carte
# tout seul — indispensable bateau inoccupé.
#
# Limite matérielle du bcm2835_wdt : timeout maximum ~15 s (ne pas augmenter).
# Prise en compte : sudo systemctl daemon-reexec (fait par install.sh).
# Vérification :   journalctl -b | grep -i watchdog
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
