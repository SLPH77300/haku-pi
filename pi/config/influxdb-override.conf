# Haku Pi — v1.2.0
# Drop-in RENDU par install.sh (placeholder @INFLUX_DATA_DIR@) et installé en
# /etc/systemd/system/influxdb.service.d/haku.conf
#
# Réglages « SD light » du bord :
#  - données dans INFLUX_DATA_DIR (aujourd'hui la carte SD ; déplaçable sur un
#    SSD USB en changeant la variable dans haku.env + rsync — voir README) ;
#  - API liée à 127.0.0.1 UNIQUEMENT : seuls Node-RED et Grafana (locaux) y
#    accèdent, rien n'est exposé sur le LAN ni le WAN ;
#  - MemoryHigh=700M : au-delà, le noyau met la pression sur influxd AVANT
#    qu'il n'étouffe Node-RED (Pi 4 Go — valeur vérifiée dans la doc systemd :
#    limite « douce », le service n'est pas tué, il est ralenti/reclaim).
[Service]
Environment=INFLUXD_BOLT_PATH=@INFLUX_DATA_DIR@/influxd.bolt
Environment=INFLUXD_ENGINE_PATH=@INFLUX_DATA_DIR@/engine
Environment=INFLUXD_HTTP_BIND_ADDRESS=127.0.0.1:8086
# Pas de rapport d'usage vers influxdata.com (bateau, data SIM comptée)
Environment=INFLUXD_REPORTING_DISABLED=true
MemoryHigh=700M
# Filet dur : si malgré tout la RAM explose, systemd tue influxd (Restart
# du paquet officiel le relance) plutôt que de laisser l'OOM-killer choisir.
MemoryMax=900M
