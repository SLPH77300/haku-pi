# Haku Pi — généré le 27/08/2026
# Installé en /etc/tmpfiles.d/haku.conf
#
# /var/log est monté en tmpfs (protection SD) : ces répertoires doivent être
# recréés à chaque boot pour les services qui en ont besoin.
# @HAKU_USER@ est remplacé par install.sh (utilisateur Node-RED).
d /var/log/apt            0755 root        root        -
d /var/log/lightdm        0711 root        root        -
d /var/log/private        0700 root        root        -
d /var/log/samba          0755 root        root        -
# Données persistantes Haku (sur SD, volume d'écriture très faible).
# L'utilisateur Node-RED doit pouvoir écrire alerts.log et le journal CSV
# (send-alert.sh et le flux tournent sous @HAKU_USER@, pas root).
d /var/lib/haku           0775 root        @HAKU_USER@ -
f /var/lib/haku/alerts.log 0664 @HAKU_USER@ @HAKU_USER@ -
d /var/lib/haku/journal   0775 @HAKU_USER@ @HAKU_USER@ -
# v1.1 : traces GPX + index carte (écrits par le flux « Traces »)
d /var/lib/haku/tracks    0775 @HAKU_USER@ @HAKU_USER@ -
# v1.1 : ports déclarés (bouton « Déclarer ce port » + géofence MARINA)
f /var/lib/haku/ports.json 0664 @HAKU_USER@ @HAKU_USER@ -
# v1.2 : ring buffer vent/baro 48 h de la page Surveillance (1 écriture/10 min)
f /var/lib/haku/meteo48h.json 0664 @HAKU_USER@ @HAKU_USER@ -
# v1.2 : les données InfluxDB (INFLUX_DATA_DIR) sont créées par install.sh
# (propriétaire influxdb:influxdb) — PAS ici : l'utilisateur influxdb n'existe
# qu'après l'installation du paquet.
# État runtime du healthcheck (en RAM)
d /run/haku               0755 root        root        -
