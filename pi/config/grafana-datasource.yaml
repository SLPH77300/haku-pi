# Haku Pi — v1.2.0
# Datasource Grafana RENDUE par install.sh (placeholders @INFLUX_ORG@,
# @INFLUX_BUCKET@, @INFLUX_TOKEN@ — le jeton vient de /etc/haku/haku.env,
# JAMAIS du dépôt) et installée en
# /etc/grafana/provisioning/datasources/haku.yaml (640 root:grafana).
apiVersion: 1

datasources:
  - name: InfluxDB Haku
    uid: haku-influx
    type: influxdb
    access: proxy
    url: http://127.0.0.1:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: "@INFLUX_ORG@"
      defaultBucket: "@INFLUX_BUCKET@"
      timeInterval: "60s"
    secureJsonData:
      token: "@INFLUX_TOKEN@"
