# Haku Pi — v1.2.0
# Drop-in RENDU par install.sh (placeholder @GRAFANA_PORT@) et installé en
# /etc/systemd/system/grafana-server.service.d/haku.conf
#
#  - port 3001 (1880 est pris par Node-RED) ; nftables ne l'ouvre QUE depuis
#    SUBNET_BORD et tailscale0 — rien côté internet (CGNAT de toute façon) ;
#  - anonyme désactivé, inscriptions désactivées (mot de passe admin généré
#    par install.sh → GRAFANA_ADMIN_PASS dans haku.env) ;
#  - MemoryHigh=300M : Grafana est contenu AVANT de gêner Node-RED (limite
#    douce systemd, cf. influxdb-override.conf).
[Service]
Environment=GF_SERVER_HTTP_PORT=@GRAFANA_PORT@
Environment=GF_SERVER_HTTP_ADDR=0.0.0.0
Environment=GF_AUTH_ANONYMOUS_ENABLED=false
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_USERS_DEFAULT_THEME=dark
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
MemoryHigh=300M
MemoryMax=450M
