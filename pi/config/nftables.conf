#!/usr/sbin/nft -f
# =============================================================================
# Haku Pi — généré le 27/08/2026
# Pare-feu nftables du Raspberry Pi du bord.
#
# Rendu par install.sh : @SUBNET_BORD@ est remplacé par la valeur de
# SUBNET_BORD dans /etc/haku/haku.env, puis le fichier est installé en
# /etc/nftables.conf (service nftables.service activé au boot).
#
# Principes :
#  - politique INPUT : drop. SSH (22) et Node-RED (1880) uniquement depuis le
#    LAN du bord et depuis Tailscale (interface tailscale0). Rien côté WAN —
#    de toute façon Starlink est en CGNAT, aucune entrée possible.
#  - on ne touche QUE la table « haku » : les règles propres de tailscaled
#    (NAT des routes annoncées, marquage) vivent dans leurs propres tables et
#    ne sont pas écrasées par un rechargement de ce fichier.
#  - FORWARD : autorise le rôle « subnet router » Tailscale → LAN du bord
#    (accès au Cerbo / Remote Console depuis le téléphone en 4G/5G).
# =============================================================================

# Recréation idempotente de la table haku uniquement (pas de « flush ruleset »,
# qui casserait les tables de tailscaled).
add table inet haku
delete table inet haku

table inet haku {

    chain input {
        type filter hook input priority filter; policy drop;

        # Boucle locale et connexions établies
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP / ICMPv6 (ping, découverte — utile au diagnostic à bord)
        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept

        # Client DHCP (réponses du routeur du bord)
        udp dport 68 accept

        # mDNS : permet « haku.local » depuis le LAN
        udp dport 5353 accept

        # Tailscale : connexions directes WireGuard entrantes (sinon relais DERP)
        udp dport 41641 accept

        # SSH + Node-RED (éditeur ET dashboard) + Grafana (3001, v1.2) :
        # LAN du bord uniquement… (3001 sans Grafana = connexion refusée,
        # inoffensif ; InfluxDB 8086 n'apparaît PAS ici : lié à 127.0.0.1)
        ip saddr @SUBNET_BORD@ tcp dport { 22, 1880, 3001 } accept
        # …via IPv6 link-local (secours si SUBNET_BORD est mal renseigné :
        # ssh bord@fe80::...%eth0 reste possible depuis le LAN)…
        ip6 saddr fe80::/10 tcp dport { 22, 1880, 3001 } accept
        # …et via Tailscale (l'interface n'existe qu'après enrôlement)
        iifname "tailscale0" tcp dport { 22, 1880, 3001 } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Subnet router : Tailscale → LAN du bord (Cerbo, Remote Console…)
        iifname "tailscale0" accept
        # Retours (tailscaled fait le SNAT des routes annoncées lui-même)
        ct state established,related accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
