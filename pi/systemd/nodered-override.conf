# Haku Pi — généré le 27/08/2026
# Drop-in RENDU par install.sh (placeholders @HAKU_USER@/@USER_HOME@) et
# installé en /etc/systemd/system/nodered.service.d/haku.conf
# (complète le service nodered.service créé par le script officiel Node-RED).
[Service]
# VERROU DÉTERMINISTE : certaines versions de l'installeur officiel forcent
# NODERED_USER=root quand il est lancé en root — on impose ici l'utilisateur
# du bord quoi qu'ait écrit l'installeur (userDir = @USER_HOME@/.node-red).
User=@HAKU_USER@
Group=@HAKU_USER@
WorkingDirectory=@USER_HOME@
# Toute la configuration du bord dans un seul fichier :
EnvironmentFile=-/etc/haku/haku.env
# Express en mode production : pas de stacktrace detaillee renvoyee au client
# sur une requete malformee (POST /journal, etc.).
Environment=NODE_ENV=production
# Bateau inoccupé : on redémarre TOUJOURS, quoi qu'il arrive.
Restart=always
RestartSec=10
# Laisse le temps à un flux de terminer proprement (écriture CSV, contexte).
TimeoutStopSec=30
